# Generated from the captured launch of the paper run; see training/recipes/README.md.
name: diffusion_gemma_aec_c100
description: 'DiffusionGemma-26B-A4B ORL (paper checkpoint = step 900), steps 1-900 in one launch. Native self-conditioning retained, 256-token canvas with every intermediate state replayed (detached prefix KV), token-mean CE + canvas-level AEC (rho 0.2, coef 100, scope all_valid, no gate), verified responses only, 1 prompt x 8 rollouts, constant AdamW lr 1e-5. Two nodes: an 8-GPU FSDP actor node (Ray head) and an 8-GPU SGLang rollout node (Ray worker); training/scripts/reproduce_diffusion_gemma.sh starts the Ray cluster and the run.'
nodes: 2
gpus_per_node: 8
base_config: QwenDLM-4B-postnorm002-DAPO-sglang-noedit-cwppo-smoke
sglang_dir: sglang_dgemma
extra_python_path:
- ${DG_TRANSFORMERS_OVERLAY}
inputs:
  MODEL_PATH: google/diffusiongemma-26B-A4B-it snapshot 52de6b914ee1749a7d4933202505ddf5b414ec43
  TRAIN_FILE: gsm8k-math-code_l0-mix-20260909/train.parquet (also used as the unused validation file)
  RUN_DIR: output directory of this run
  RAY_ADDRESS: HEAD_IP:PORT of the Ray head started on the actor node
  ACTOR_NODE_IP: IP of the actor node (Ray head)
  ROLLOUT_NODE_IP: IP of the rollout node (Ray worker)
  DG_TRANSFORMERS_OVERLAY: runtime Transformers 5.8.1 overlay built by training/scripts/install_dgemma_transformers_overlay.sh
  NET_IFNAME: 'network interface for NCCL/Gloo (default: the default-route interface)'
