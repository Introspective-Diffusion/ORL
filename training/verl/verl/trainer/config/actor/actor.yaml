# Format checks enforced on CI:
# 1. Comments must appear above each field.
# 2. There must be a blank line between each field.
# 3. Inline comments (after a field on the same line) are not allowed.
# 4. Indentation level is respected for nested fields.

# Target class for this configuration
_target_: verl.workers.config.ActorConfig

# Number of rollouts per update (mirrors actor rollout_n)
rollout_n: ${oc.select:actor_rollout_ref.rollout.n,1}

# the abstract actor configs
# fsdp, fsdp2 or megatron. must be set.
strategy: ???

# Split each sample into sub-batches of this size for PPO
ppo_mini_batch_size: 256

# [Deprecated] Global micro batch size
ppo_micro_batch_size: null

# Local per-GPU micro batch size
ppo_micro_batch_size_per_gpu: null

# Whether to automatically adjust batch size at runtime
# oc.select: the default val for ref.log_prob_use_dynamic_bsz
use_dynamic_bsz: false

# Max tokens per GPU in one PPO batch; affects gradient accumulation
# Typically it should be: n * ${data.max_prompt_length} + ${data.max_response_length}
# oc.select: the default val for ref.log_prob_max_token_len_per_gpu
ppo_max_token_len_per_gpu: 16384

# PPO clip ratio
clip_ratio: 0.2

# Lower bound for asymmetric clipping (used in dual-clip PPO)
clip_ratio_low: 0.2

# Upper bound for asymmetric clipping (used in dual-clip PPO)
clip_ratio_high: 0.2

# Positive and negative tau for smoothing function in SAPO (https://arxiv.org/pdf/2511.20347)
# default values used in the paper with Qwen3-30B-A3B-Base
tau_pos: 1.0

# negative tau for smoothing function in SAPO
tau_neg: 1.05

# Whether to freeze vision model, if set true, it will be freeze vision model
freeze_vision_tower: false

# policy loss config
policy_loss:

  # # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
  _target_: verl.workers.config.PolicyLossConfig

  # Loss function mode: vanilla / clip-cov / kl-cov /gpg from https://arxiv.org/abs/2505.22617
  loss_mode: "vanilla"

  # Ratio of tokens to be clipped for clip-cov loss
  clip_cov_ratio: 0.0002

  # Lower bound for clip-cov loss
  clip_cov_lb: 1.0

  # Upper bound for clip-cov loss
  clip_cov_ub: 5.0

  # Ratio of tokens to be applied kl penalty for kl-cov loss
  kl_cov_ratio: 0.0002

  # KL divergence penalty coefficient
  ppo_kl_coef: 0.1

# Constant C in Dual-clip PPO; clips when advantage < 0 and ratio > C
clip_ratio_c: 3.0

# Loss aggregation mode: "token-mean", "seq-mean-token-sum", "seq-mean-token-mean", or "seq-mean-token-sum-norm"
loss_agg_mode: token-mean

# Scale factor for "seq-mean-token-sum-norm" loss aggregation mode.
# If null, uses response_length. Set to a constant to ensure consistent normalization.
loss_scale_factor: null

# Entropy regularization coefficient in PPO loss
entropy_coeff: 0

# When true, the actor forward will request entropy from the model
calculate_entropy: false

# Whether old-logprob recomputation should also return entropy metrics
compute_old_log_prob_entropy: true

# Skip old-logprob recomputation when generation_consistency_jsd replaces the
# policy-gradient objective. This path keeps old_log_probs only as a batch
# schema placeholder; the actor loss is JSD-only.
skip_old_log_prob_for_jsd_replace: false

# Whether actor replay/update should render tqdm progress bars
show_progress: true

# Opt-in JetEngine diagnostic/strict-matching mode. When true, actor
# replay/update logprobs use raw logits instead of temperature-scaled logits.
use_raw_replay_log_probs: false

# Whether actor PPO should use rollout-provided old_log_probs instead of
# replacing them with current actor logprobs in one-epoch/on-policy-shaped runs.
use_rollout_log_probs: false

# Whether PPO update should report current-policy vs rollout-policy diagnostic
# metrics when rollout_log_probs are present. Disable for profiling/scale runs
# when the tensor is not needed by the loss.
report_rollout_corr_metrics: true

# Qwen no-stream rule-GRPO replay. This mode is disabled by default and, when
# enabled, requires generation_consistency_jsd.mode=replace/objective=tpf_reinforce.
qwen_nostream_grpo:

  enable: false

  # Mandatory native no-copy external-prefix-KV replay. The actor refuses
  # packed/repeated-prefix fallback when this is true.
  enable_external_prefix_kv: true

  # Exact target launch shape for OpenR1 Qwen rule RL.
  rollout_n: 8
  response_max_length: 8192
  block_size: 64

  # Deterministic random non-final replay fraction, unioned with every final row.
  selector_seed: 42
  selector_fraction: 0.10

  # Clip normalized block TPF scale applied to GRPO advantages.
  tpf_min_weight: 0.25
  tpf_max_weight: 4.0

  # Missing TPF metadata is fatal for the required rule-GRPO path.
  missing_tpf_policy: error

# DiffusionGemma no-stream rule-GRPO replay. The selected mode reuses the
# detached-prefix Gemma actor path but applies signed GRPO*block-TPF weights.
gemma_nostream_grpo:

  enable: false
  rollout_n: 8
  response_length: 8192
  block_size: 256
  selector_seed: 42
  selector_fraction: 0.10
  tpf_clip_low: 0.25
  tpf_clip_high: 4.0

  # Both are mandatory: selected mode refuses fallback/full-prefix replay.
  require_external_prefix_kv: true
  require_incremental_prefix_cache: true

# DiffusionGemma checkpoint-38750-style baseline. Native Gemma rollout is
# unchanged; after strict verification, every captured denoising row from every
# correct response receives final-clean active-block CE with one global token
# denominator. GRPO, TPF weighting, state selection, and residual input changes
# are forbidden when this mode is enabled.
gemma_correct_only_baseline:

  enable: false

  # true: pin the original GSM8K baseline contract exactly (response_length 2048, full prefix gradients).
  # false: also allow response_length 4096 and gemma_replay_prefix_grad_mode=detached (prefix KV cached, no
  # gradient through the prefix encode) -- needed to fit the mix-data run on 8 x H100 80GB actors.
  strict_contract: true

# Optional confidence weighting for the standard PPO objective. Weights are
# supplied by rollout/trainer batches and multiply token advantages.
confidence_weighted_ppo:

  # Disabled by default to preserve vanilla PPO behavior.
  enable: false

  # Drop rollout-confidence weights below this value.
  threshold: 0.0

  # Clamp retained weights to avoid accidental extreme loss scaling.
  min_weight: 0.0

  # Clamp retained weights to avoid accidental extreme loss scaling.
  max_weight: 1.0

# Optional confidence-thresholded dense policy-gradient loss on noisy response positions
dense_noisy_pg:

  # Keep disabled by default to preserve the original first-accept PPO behavior
  enable: false

  # Only tokens with detached p(final token | replay state) above this threshold contribute
  threshold: 0.1

  # Multiplicative coefficient for the dense loss term
  loss_coef: 1.0

  # "add" keeps the original PPO loss and adds dense loss; "replace" uses dense loss only
  mode: add

# Optional full-vocab JSD consistency loss between replay logits and rollout
# final-generation logits. Disabled by default.
generation_consistency_jsd:

  enable: false

  # "add" keeps PPO and adds JSD; "replace" trains with JSD only.
  mode: replace

  # full_jsd, top_token_jsd, gated_ce, clean_causal_ce, clean_agree_ce,
  # trace_all_ce, trace_all_rkl, trace_future_ce, or tpf_reinforce.
  objective: full_jsd

  loss_coef: 1.0

  # Entropy regularization for Qwen trace_all_ce/trace_future_ce replay.
  # penalty minimizes CE + coef * H; bonus minimizes CE - coef * H.
  # DiffusionGemma replay ignores this setting.
  entropy_coef: 0.0
  entropy_mode: penalty
  # Optional hinge target for penalty mode: CE + coef * relu(H - target).
  # Once mean replay entropy reaches the target, further sharpening stops.
  entropy_target: null

  # Optional adjacent denoising-state entropy contraction for trace_all_ce.
  # The producer supplies stop-gradient H_t and M_{t+1}; the actor computes
  # H_{t+1} from current hidden states. Disabled by default and inert unless
  # both this gate and the SGLang algorithm-config gate are enabled.
  adjacent_entropy_contraction:
    enable: false
    rho: 0.05
    coef: 0.01
    projection_chunk_size: 512
    eps: 1.0e-8
    response_level: false
    ceiling: 0.0
    # How AEC treats rows that signed_trace_ce marks. AEC only ever demands
    # rising confidence, so contracting the wrong rows the signed objective is
    # pushing down teaches the model to be confidently wrong.
    #   exclude_negative: skip role=-1 rows (default; keeps +1 and 0 pressure)
    #   positive_only:    contract only the selected correct row per prompt
    #   none:             historical behaviour, contract every row
    # Ignored when signed_trace_ce is off.
    signed_role_filter: exclude_negative

  # Loss-free full-vocabulary calibration probe for entropy-gated reverse KL.
  # For every valid trace-all-CE label with captured rollout teacher hidden,
  # report H(q_teacher)/log(V), KL(p_actor||q_teacher), threshold counts, and
  # conditional RKL quantiles. This never changes the training objective.
  entropy_gated_rkl_probe:
    enable: false
    thresholds: [0.01, 0.02, 0.03, 0.05, 0.075, 0.10, 0.125, 0.15, 0.20, 0.25, 0.30]

  # Hybrid trace objective: use final-clean CE above the fixed teacher-entropy
  # threshold and full-vocabulary KL(p_actor || q_rollout_teacher) below it.
  # Entropy is normalized by log(vocab_size); RKL is hard-capped per token.
  entropy_gated_rkl:
    enable: false
    entropy_threshold: 0.10
    rkl_cap: 5.0
    # CAD mode (Consistency Forcing, arXiv:2608.13925): low-entropy tokens use
    # fkl_coef * KL(q_teacher || p_student)
    #   + (max_v q_teacher_v)^cj_power * capped RKL
    # instead of capped RKL alone; the forward-KL floor is the stabilizer.
    cad_mode: false
    fkl_coef: 1.0
    cj_power: 1.0
    # Opt-in composition with adjacent_entropy_contraction.
    # AEC's hinge consumes only student-entropy sums, pair weights, and
    # count/weight denominators — never the per-token CE/RKL loss values — and
    # its additive term stays outside the trace-CE numerator/denominator that
    # the entropy_gated_rkl parity sums audit. The flag unlocks BOTH
    # directions: the egrkl guard's AEC term and response_level_ce's egrkl
    # term (response-level AEC requires response_level_ce; the same audit
    # holds — its 1/N pair/CE weights are built from masks and counts only).
    # Under response_level_ce the egrkl parity/count checks recompose against
    # the weighted loss sum and weight sum instead of raw token counts.
    allow_aec_composition: false

  # Equal-original-response CE: pool all retained denoising-state/token losses
  # for one response_uid, average within that response, then average responses.
  response_level_ce:
    enable: false

  # Keep final-clean CE labels only where the already-existing forced-causal
  # commit forward assigns the final token probability above this threshold.
  # The producer probability is transported by async request metrics; no extra
  # model forward or synchronous GPU-to-CPU transfer is allowed.
  causal_prob_ce_filter:
    enable: false
    threshold: 0.9
    direction: greater_than

  # Fixed-batch grad-scale denominator (response units). When >0, the
  # streaming trace-all-CE grad-scale denominator is clamped from below by
  # this pre-filter response count (set it to B*R), so the optimizer-step
  # magnitude scales with keep_frac instead of concentrating the full
  # batch's gradient mass on the few quality-filter survivors. Requires
  # response_level_ce (denominator units = responses). 0 disables.
  fixed_batch_denominator: 0

  # Adjacent average entropy contraction for the DiffusionGemma exact-replay path
  # (verl/trainer/ppo/gemma_adjacent_entropy.py). Per block, consecutive captured states
  # (t -> t+1): hinge = relu(H_next - (1-rho) * H_prev)^2 on the mean normalised canvas entropy,
  # L = coef * sum(hinge) / N_pairs. scope: all_valid (all 256 canvas positions) | renoised
  # (positions whose canvas token changed, i.e. not accepted at step t). H_prev is the actor's
  # own detached entropy (the fork captures no rollout logits). Requires gemma_replay_real_row_pack.
  gemma_adjacent_entropy_contraction:
    enable: false
    rho: 0.2
    coef: 50.0
    scope: all_valid
    floor: 0.0
    ceiling: 0.0

  # Number of active rows to process per full-vocab JSD chunk.
  row_chunk_size: 1

  # Optional sampled/selected vocabulary size for trace_all_ce. 0 means full vocab.
  selected_vocab_size: 0

  # For clean_agree_ce, split expanded replay rows into forward/backward
  # chunks while keeping one optimizer step for the whole replay batch.
  stream_replay_chunk_size: 0
  stream_replay_empty_cache: true

  # DiffusionGemma replay uses the same block schema in both modes. The
  # final_response path withholds every block until generation has completed.
  gemma_replay_delivery: final_response
  # When true for objective=gemma_denoise_ce, DiffusionGemma FSDP installs a
  # version-pinned post-reduce hook that captures each FP32 local shard before
  # FSDP casts to BF16. Public .grad accumulation is intentionally unsupported.
  gemma_replay_fp32_grad_accum: false
  # Keep persistent FP32 accumulators in CPU RAM; only the currently reduced
  # shard and final materialized gradient are resident on GPU.
  gemma_replay_fp32_grad_accum_cpu_offload: false
  # detached builds the causal prefix under no-grad and reuses its KV cache.
  # full runs each prefix+decoder replay chunk in one differentiable native
  # DiffusionGemma forward. Correct-only baseline mode requires full.
  gemma_replay_prefix_grad_mode: detached
  # Number of intermediate decoder rows whose graphs are held at once.
  gemma_replay_decoder_chunk_size: 1
  # Offload saved DiffusionGemma replay activations to pinned CPU memory while
  # retaining live FSDP parameter views. This is numerically equivalent and
  # intended for long-prefix full-gradient rows near the H100 memory limit.
  gemma_replay_decoder_activation_offload: false
  # Pack only real intermediate denoise rows into decoder chunks. Ghost rows
  # preserve identical FSDP collective counts across ranks without adding loss.
  gemma_replay_real_row_pack: false
  # Replay-only experiment: run the DiffusionGemma decoder MoE router/expert
  # branch independently per replay row while preserving chunked attention/dense work.
  gemma_replay_row_isolated_moe: false
  # Replay-only experiment: run the full DiffusionGemma decoder independently
  # per replay row while keeping one loss/backward per replay chunk.
  gemma_replay_full_row_isolated_decoder: false

  # Emit replay for ready train step keys where (step_key - offset) % stride == 0.
  # A stride of 1 keeps every ready step.
  stream_replay_step_stride: 1
  stream_replay_step_offset: 0

  # GPU-resident incremental prefix KV cache for DiffusionGemma replay.
  # Default-off. When enabled, each actor DP rank caches the encoder KV from
  # block N-1 and extends it with only the newly committed tokens for block N,
  # avoiding a full prefix re-encode for every block after the first.
  # The cache is rank-local, invalidated on optimizer step / weight sync /
  # accumulation abort / exception / end-of-update, and never reused across
  # global steps. Enable with:
  #   actor.generation_consistency_jsd.gemma_replay_gpu_incremental_prefix_cache=true
  gemma_replay_gpu_incremental_prefix_cache: false

  # Maximum number of sample/block entries kept on each actor GPU. Eight is
  # sized for the expected one-sample-per-rank wave schedule while bounding
  # stale/evicted response overlap. Must be positive.
  gemma_replay_incremental_prefix_cache_max_entries: 8

  # Hard per-rank byte cap including KV tensors and stored prefix token IDs.
  # 8589934592 is 8 GiB. Must be positive; lower this when actor headroom is
  # constrained. Oversized individual entries are rebuilt and not retained.
  gemma_replay_incremental_prefix_cache_max_bytes: 8589934592

  # When true and real SGLang replay tensors are available, build one replay row
  # per traced denoise step instead of only accepted-token rounds.
  trace_replay_all_steps: false
  trace_replay_full_blocks_only: false

  # Positive trace_all_ce label scope:
  # - active_block_all: final targets for every valid token in the captured block
  # - masked_input: final targets only where captured noisy input is MASK
  # - random_vocab_input: final targets only at positions that were unresolved
  #   random-vocabulary inputs before the captured denoising step
  # - current_action: exact accepted/edited SGLang proposal IDs for this step
  # All scopes replay the same full captured input state and residual.
  trace_all_ce_token_scope: active_block_all

  # Replay input intervention:
  # - exact: use the captured active-block token state.
  # - random_active_block: replace only the currently decoded noisy block with
  #   deterministic random-vocabulary IDs. Prompt and historical clean blocks
  #   remain exact; residual pages are unchanged.
  # - random_nonfinal_active_block: as above, but final denoise rows remain
  #   exact anchors.
  # - mixed_exact_random_nonfinal: final rows remain exact and non-final pages
  #   are deterministically randomized at trace_all_ce_random_page_fraction.
  trace_all_ce_replay_input_mode: exact
  trace_all_ce_random_seed: 20260722
  # Historical default uses retained packed-round ordinal. trace_step_key makes
  # overlapping 100%/selected replay states receive identical random IDs.
  trace_all_ce_random_identity: round_ordinal
  trace_all_ce_random_token_high: 151669
  trace_all_ce_random_page_fraction: 0.5

  # Optional response-level selection after correctness filtering.
  response_tpf_top1_filter:
    enable: false

  # Optional correct-only Selective Quartile Training state selector. This is
  # independent of response_tpf_top1_filter and tpf_reinforce: it keeps
  # trace_all_ce labels unchanged within selected denoise states.
  #
  # score options:
  #   new_accept_count     (v1): rank by newly accepted tokens DESC (existing)
  #   edit_then_new_accept (v2): rank positive-edit states first by
  #     edit_change_count DESC, then fill remaining slots from zero-edit states
  #     by new_accept_count DESC; ties resolved by local_step/step_key ASC.
  trace_all_ce_state_selection:
    enable: false
    fraction: 0.25
    direction: highest
    score: new_accept_count
    group_fields: [response_uid, block_index]
    # Require one explicit final denoise row per group and always union it with
    # the ranked ceil(fraction * group_rows) selection.
    final_policy: always_include

  # Signed all-token CE: per-prompt-uid response routing for positive and
  # negative CE branches (a top-TPF baseline and a residual variant).
  # Default OFF; does not affect any existing path when disabled.
  #
  # When enabled:
  #   - All n rollouts are generated; response filtering is post-generation.
  #   - Per prompt uid: exactly one highest response-TPF correct response
  #     gets role +1 (positive CE); ceil(0.25 * n_wrong) highest response-TPF
  #     wrong responses get role -1 (negative CE); all others are role 0 (drop).
  #   - Positive rows use active_block_all final-clean CE + EOS absorption.
  #   - Negative rows use active_block_all final-clean CE through the first real
  #     EOS only; no synthetic EOS+16 appended to wrong rows.
  #   - Loss = mean_global_tokens(CE_positive) - mean_global_tokens(CE_wrong),
  #     independent global denominators, coefficients exactly 1 and 1.
  #   - Positive-only or negative-only batches are valid signal; only a truly
  #     zero-signal batch (no +1 and no -1 rows) is skipped.
  #   - Leases for role 0 are acknowledged/recycled; +1 and -1 leases are
  #     retained through the actor update.
  #   - NaN/Inf in either branch fails closed with no optimizer step.
  signed_trace_ce:
    enable: false
    # fraction of verifier-wrong responses selected as negative CE per prompt
    wrong_fraction: 0.25
    # tie-breaking: stable rollout-index ascending for equal TPF
    tpf_tie_key: rollout_index

  # Causal wrong-response CE. Correct responses keep the configured producer
  # per-block state selector. Confidently wrong responses retain exactly one
  # final denoise row per block and train every real response token once from
  # the strict clean-x0 causal predecessor source. Uncertain responses drop.
  #
  # Loss = global_token_mean(correct trace CE)
  #      - global_token_mean(wrong clean-causal CE)
  #
  # This objective is distinct from signed_trace_ce and negative_action_pg.
  # It requires the enhanced reward's verification_status field, full-vocab
  # active_block_all CE, ppo_epochs=1, producer state selection, and packed
  # rank-aligned global normalization.
  causal_wrong_ce:
    enable: false

  # Row-packing strategy for trace_all_ce replay:
  #
  # - none (default): one training row per (sample, captured-step).
  #   Row count = sum_b(D_b) where D_b is the number of trace steps for block b.
  #   Default behavior; byte-for-byte compatible with existing configs.
  #
  # - all_blocks_unpacked: retain all captured blocks but materialize every
  #   (block, round) as a separate row. This is the exact full-coverage
  #   performance/parity baseline; row count remains sum_b(D_b).
  #
  # - all_blocks_per_round: pack all active blocks for the same round ordinal
  #   into a single training row. For packed round r, every block that has a
  #   captured step at ordinal r fills its exact response span in a shared
  #   round_step_b; _one_round_vectorized merges the non-overlapping block pages
  #   in one forward call. Row count = max_b(D_b), saving sum_b(D_b)-max_b(D_b)
  #   rows per sample.
  #
  #   Constraints (enforced at startup):
  #     - trace_all_ce_token_scope must be active_block_all (not current_action)
  #     - objective must be trace_all_ce (not trace_future_ce)
  #     - tpf_reinforce and negative_action_pg must be disabled
  #     - dense_noisy_pg, KL, actor entropy, and trace entropy penalties must
  #       be disabled; generation_consistency_jsd.mode must be replace
  #     - stream_replay_chunk_size must be positive so every chunk is scaled
  #       by its active-token count before one global-denominator optimizer step
  #     - algorithm.ar_prob_advantage.max_training_rounds_per_sample must be 0
  #       or at least the eligible unpacked-row count for every sample; a
  #       binding row cap selects different examples after row packing
  #     - VERL_QWEN_BLOCK_LOCAL_REPLAY=0 (env var must be unset or 0)
  #     - split_gpu_streaming direct-compact requires sparse_pages
  #
  #   Metrics emitted (always, set to 0 when packing=none):
  #     trace_all_ce/packing_enabled          1.0 when all_blocks_per_round
  #     trace_all_ce/packing_unpacked_mode    1.0 when all_blocks_unpacked
  #     trace_all_ce/packing_unpacked_rows    sum_b D_b across the batch
  #     trace_all_ce/packing_packed_rows      max_b D_b across the batch
  #     trace_all_ce/packing_rows_saved       unpacked - packed
  #     trace_all_ce/packing_blocks_per_row_mean  mean blocks per packed row
  #     trace_all_ce/packing_multi_block_samples  samples proving all-block capture
  #     trace_all_ce/packing_single_block_samples samples with only one captured block
  #
  # Set the optional strict gate below in parity/smoke jobs to reject a silent
  # single-block-only capture pipeline.
  trace_all_ce_packing: none
  trace_all_ce_packing_require_multi_block: false

  # Fail closed on corrupted/adversarial replay metadata before allocating
  # packed rows. Zero disables the cap; 256 matches SDAR's normal max steps.
  trace_all_ce_packing_max_rounds_per_block: 256

  # Replay hidden-state materialization for all-block packing:
  # - dense: legacy [rows, response_length, hidden] tensors
  # - sparse_pages: bounded [rows, pages, block, hidden] pages that are sliced
  #   with each actor rank before remove-padding materialization.
  trace_all_ce_packing_materialization: dense

  # Distributed execution policy for sparse packed rows:
  # - none: preserve the existing actor batch scheduler
  # - row_dp: cost-balance complete packed rows across actor data ranks
  # - hybrid: row_dp when rows fill ranks, then block-owned subrows across
  #   underfilled DP ranks; optional static Ulysses SP shards each subrow.
  trace_all_ce_parallelism: none

  # Exact fallback when hybrid DP has fewer packed rows than actor ranks:
  # - block_only: split labels/pages only by active response block
  # - block_then_label: after block split, bisect disjoint active-label
  #   positions until DP ranks are filled; remaining ranks are zero-label
  #   ghosts when there are fewer active labels than ranks. This DP-first mode
  #   requires ulysses_sequence_parallel_size=1.
  trace_all_ce_underfill_fallback: block_only

  # Allowed static Ulysses SP sizes for hybrid mode.
  trace_all_ce_sp_sizes: [1, 2, 4, 8]

  # Fail fast unless both actor and SGLang rollout enable cross-step
  # self-conditioning and replay carries the captured signal.
  require_self_conditioning_replay: false

  # Training-only absorbing EOS targets for positive trace-CE rollouts. After
  # the first real EOS, append at most extra_tokens EOS labels without crossing
  # that response block or rollout.response_length. Reward/text stay unchanged.
  eos_absorption:

    # Enable training-only post-EOS labels.
    enable: false

    # Maximum additional EOS labels within the current response block.
    extra_tokens: 16

  # Keep correct, rule-good responses on trace_all_ce. Incorrect or legacy
  # rule-bad responses receive fixed negative advantage on exact accepted/edited
  # SGLang actions; rejected proposals and final clean tokens are not actions.
  negative_action_pg:

    # Enable the hybrid positive-CE/negative-PG objective.
    enable: false

    # Fixed response-level advantage broadcast to each accepted/edited action.
    advantage: -1.0

    # Multiplicative coefficient for the positive trace-CE branch.
    ce_loss_coef: 1.0

    # Multiplicative coefficient for the negative action-PG branch.
    loss_coef: 1.0

    # Normalize CE and action-PG separately over distributed token counts.
    global_token_normalization: true

  # Default-disabled row-level filtered REINFORCE over exact sampled denoise
  # actions captured by SGLang SDARPrefixKV replay tensors.
  tpf_reinforce:
    metadata_first: false
    # Pad selected replay rows with zero-advantage ghost rows so every actor
    # data-parallel rank executes the same number of FSDP forward/backward calls.
    rank_aligned_padding: true
    # Normalize each distributed mini-batch by its global selected action-token
    # count instead of averaging independent per-rank/per-microbatch means.
    global_token_normalization: true
    reward_provider: new_accept_count
    group_fields: [response_uid, block_index]
    reward_epsilon: 1.0e-6
    min_group_size: 1
    selector_fraction: 0.10
    final_policy: flag
    # TPF alone rewards confidence and can be maximized by repetitive garbage.
    # TPF runs must explicitly enable rollout_quality_filter so rejected
    # responses are ineligible for both top-fraction and forced-final replay.
    quality_gate_field: rollout_quality_keep
    # Singleton/zero-variance groups have no policy-gradient signal. Excluding
    # them prevents final-row union from degenerating into nearly 100% replay.
    nonzero_advantage_only: true
    # Optional TPF-only LR applied after checkpoint optimizer state is loaded.
    # This avoids resumed optimizer param groups silently restoring a stale LR.
    optimizer_lr_override: null
    reduction: token_mean
    loss_coef: 1.0

  # Block-level TPF weighting for trace_all_ce. Default-off. Separate from
  # tpf_reinforce and entropy regularization. Computes one detached scalar per
  # (response_uid, block_index) from rollout_self_conditioning metadata, then
  # weights every active CE token in the same block identically.
  #
  # source: "rollout_new_accept_per_denoise_forward" uses the exact producer
  #   summary new_accept_tokens / denoise_forwards. The equivalent fallback is
  #   sum(new_accept_count over non-terminal denoise rows) / number of those
  #   rows. action_token_count is deliberately not a denominator. Producer
  #   summaries are validated against the denoise rows.
  #
  # normalize: "global_mean" divides each block TPF by the distributed mean
  #   over unique real (response_uid, block_index) blocks, each counted once
  #   across actor DP ranks. Ghost/padded rows are excluded. The result is
  #   clipped to [min, max].
  #
  # missing_metadata_policy: "error" (default) raises if rollout_self_conditioning
  #   or response_uid is absent; "disable" falls back to unweighted CE on all
  #   actor ranks. The weighted path currently requires trace_all_ce replace
  #   mode, ppo_epochs=1, entropy/KL auxiliaries off, and remove-padding on.
  block_tpf_ce_weight:
    enable: false
    source: rollout_new_accept_per_denoise_forward
    normalize: global_mean
    min: 0.25
    max: 4.0
    missing_metadata_policy: error

  # Used by trace_future_ce: distill each replay step from logits recorded this
  # many denoise steps later. Tail rows without a matching future replay state are skipped.
  trace_future_logits_offset: 5
  trace_future_skip_tail_steps: 5
  # When true, trace_future_ce trains current trace rows with final hard labels
  # instead of the future soft teacher distribution.
  trace_future_hard_label_ce: false
  # strict_skip preserves exact t+k semantics. last_available_skip_final trains
  # close-time tail steps from the final available trace state, except the final
  # trace step itself.
  trace_future_tail_policy: strict_skip
  # When true with last_available_skip_final, any remaining close-time non-final
  # trace step without an exact future teacher also trains against the final trace
  # state instead of being left as unsupported pending replay.
  trace_future_train_all_missing_with_final: false
  # When true with trace_future_train_all_missing_with_final, also include the
  # final trace step itself and map it to the final trace state. This is mainly
  # for hard-label CE parity with trace_all_ce.
  trace_future_train_final_step_with_final: false
  # When true, soft trace_future_ce builds the teacher source from all block-local
  # replay hidden states available at the teacher step instead of only that step's span.
  trace_future_accumulate_teacher_blocks: true
  # When true with accumulated soft trace_future_ce streaming, direct compact
  # transfer sends only new support replay tensors and the trainer reconstructs
  # required accumulated teacher state from a per-stream cache.
  trace_future_delta_teacher_cache: false
  # null means auto: require exact replay input snapshots when rollout edit is
  # enabled. Set explicitly to true/false to override auto-detection.
  trace_future_require_input_ids:
  trace_future_clean_filter: false
  trace_future_clean_consistency_enable: false
  clean_consistency_high_prob_threshold: 0.9
  clean_consistency_low_prob_threshold: 0.1
  clean_consistency_pos_coef: 0.0
  clean_consistency_neg_coef: 0.0
  clean_consistency_neg_prob_clip: 0.99
  clean_consistency_neg_loss_clip: 5.0

  # Optional teacher confidence gate.
  teacher_max_prob_threshold: 0.0

  # Used by top_token_jsd: rollout final selected-token probability gate.
  teacher_prob_threshold: 0.9

  # Used by top_token_jsd: current student final selected-token probability gate.
  student_final_prob_threshold: 0.9
  clean_filter_require_top_match: true

  # Used by top_token_jsd: top-k union size from student and final logits.
  topk: 64

  # Optional rollout-level filter. When enabled, a rejected rollout contributes
  # no replay tokens to generation_consistency_jsd/gated_ce.
  rollout_quality_filter:
    enable: false
    # correctness_only routes solely by task reward. rule_based additionally
    # applies deterministic repetition rules. server uses an external quality
    # judge after the correctness gate.
    mode: rule_based
    # Best-of-group teacher (correctness-only modes): keep exactly one
    # surviving rollout per prompt group as the CE distillation target.
    # none|shortest|longest|first
    best_of_group: none
    require_correct: false
    # Fail closed when enabled: every rollout must provide an SGLang finish
    # reason, and finish_reason=length is rejected even when reward is correct.
    reject_length: false
    max_word_run: 3
    min_unique_word_ratio: 0.16
    max_answer_markers: 1
    max_boxed_markers: 3
    max_repeated_character_run: 32
    max_whitespace_run: 64
    tail_window_chars: 512
    min_tail_nonspace_chars: 128
    min_tail_unique_character_ratio: 0.02
    # Reject a 12-token span repeated twice or an 8-token span repeated
    # three times. Matches must be non-overlapping.
    long_ngram_size: 12
    max_long_ngram_occurrences: 1
    short_ngram_size: 8
    max_short_ngram_occurrences: 2
    # Also reject duplicated long reasoning segments and three-way
    # near-duplicate segment cycles.
    min_segment_words: 10
    near_duplicate_similarity: 0.9
    near_duplicate_occurrences: 3
    compact_rejected_rows: false
    # Raise the zero-signal control flow before replay construction so an
    # all-rejected rollout batch never launches an actor forward/backward.
    skip_actor_if_none: true
    # Extends the same skip to near-starved batches. 0.0 keeps the historical
    # "only skip at exactly zero kept" behaviour.
    skip_actor_min_keep_frac: 0.0
    server_judge:
      # Endpoints can be passed here or through servers_json_env. Each item:
      # {url: ".../v1/chat/completions", model: "...", api_key_env: "..."}.
      servers: []
      servers_json_env: VERL_ROLLOUT_JUDGE_SERVERS_JSON
      # Base64 transport avoids shell/container quoting for endpoint JSON.
      servers_json_b64_env: VERL_ROLLOUT_JUDGE_SERVERS_B64
      api_key_env: ROLLOUT_JUDGE_API_KEY
      concurrency: 8
      timeout_seconds: 120.0
      max_retries: 1
      max_tokens: 8192
      retry_max_tokens: 8192
      temperature: 0.0
      # A service outage is not a quality verdict; abort instead of silently
      # advancing the data loader with all samples rejected.
      error_policy: raise
      fail_closed: true
      # Optional provider-specific fields such as reasoning_effort.
      extra_body: {}

  # Teacher distribution source: rollout_final or clean_causal.
  teacher_source: rollout_final

  # Block size for clean_causal teacher; 1 means token-causal.
  teacher_staircase_size: 1

  # Temperature applied to both teacher and student logits inside the JSD.
  temperature: 1.0

  # Clamp teacher/student logits before full-vocab JSD for numerical stability.
  logit_clip: 50.0

  # Lower bound used when taking log of the mixture distribution.
  prob_eps: 1.0e-6

# Replace NaN/Inf gradients with zero immediately before gradient clipping.
sanitize_nonfinite_grads: false

# Whether to use KL loss instead of KL reward penalty. True for GRPO
use_kl_loss: false

# Whether to enable PrefixGrouper shared-prefix forward
use_prefix_grouper: false

# Context-local no-copy external-prefix KV attention for DiffusionGemma replay.
# Both streaming CE and rule-based RL replay decoder forwards use this flag.
use_diffusion_gemma_external_kv_replay: false

# Context-local no-copy external-prefix KV attention for Qwen no-stream rule-GRPO.
use_qwen_external_prefix_kv_replay: false

# Whether to use torch.compile()
# oc.select: the default val for ref.use_torch_compile
use_torch_compile: true

# KL loss coefficient when use_kl_loss is enabled. For GRPO
kl_loss_coef: 0.001

# Type of KL divergence loss. Options: "kl"(k1), "abs", "mse"(k2), "low_var_kl"(k3), "full"
kl_loss_type: low_var_kl

# Number of PPO epochs per batch
ppo_epochs: 1

# Shuffle training data across PPO epochs
shuffle: false

# The seed used to construct mini-batch
data_loader_seed: 42

# checkpoint configs
checkpoint:

  # Target dataclass for this configuration
  _target_: verl.trainer.config.CheckpointConfig

  # What to include in saved checkpoints
  # with 'hf_model' you can save whole model as hf format, now only use sharded model checkpoint to save space
  save_contents: ['model', 'optimizer', 'extra']

  # For more flexibility, you can specify the contents to load from the checkpoint.
  # .xxx refers to the local variable xxx from the same level of hierarchy similar to python pkg
  load_contents: ${.save_contents}

  # Whether to save checkpoints asynchronously. Only effective for Megatron as of now.
  async_save: False
  
  # Mbridge config extension.
  # when vanilla_mbridge=True, and your filesystem is a distributed filesystem,(which means you write a file in node A
  # and you can read the file in node B immediately)
  # set `mbridge_config.distributed_filesystem=True` and `mbridge_config.memory_efficient=True` to 
  # speed up the checkpoint saving by 10x speed.
  mbridge_config: {}

# optimizer configs
optim:

  # Learning rate
  lr: 1e-6

  # Warmup steps ratio (used if lr_warmup_steps is 0 or negative)
  lr_warmup_steps_ratio: 0.0

  # Total training steps (must be overridden at runtime)
  total_training_steps: -1

  # Weight decay
  weight_decay: 0.01

  # Prioritized. None, 0 or Negative values mean delegating to lr_warmup_steps_ratio.
  lr_warmup_steps: -1


# Whether to use custom fused kernels (e.g., FlashAttention, fused MLP)
use_fused_kernels: ${oc.select:actor_rollout_ref.model.use_fused_kernels,false}

# profile the actor model in `update_policy` 
profiler:

  # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
  _target_: verl.utils.profiler.ProfilerConfig

  # profiler tool, default same as profiler.tool in global config
  # choices: nsys, npu, torch
  tool: ${oc.select:global_profiler.tool,null}

  # whether enable profile on Actor
  enable: False
  
  # Whether to profile all ranks.
  all_ranks: False

  # The ranks that will be profiled. [] or [0,1,...]
  ranks: []

  # profile results saving path
  save_path: ${oc.select:global_profiler.save_path,null}

  # specific tool config which only related to the role
  tool_config:

    # nsys tool config
    nsys:

      # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
      _target_: verl.utils.profiler.config.NsightToolConfig
    
      # True for each task has its own database, False for all tasks in one training step share one database.
      discrete: ${oc.select:global_profiler.global_tool_config.nsys.discrete}
    
    # npu config
    npu:

      # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
      _target_: verl.utils.profiler.config.NPUToolConfig

      # Contents to profile, can be empty
      # options: npu, cpu, memory, shapes, module, stack
      contents: []

      # Collection level, optional values: level_none, level0, level1, level2.
      level: "level0"

      # Whether to automatically parse the data.
      analysis: True

      # True for each task has its own database, False for all tasks in one training step share one database.
      discrete: False
    
    # torch profiler config
    torch:

      # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
      _target_: verl.utils.profiler.config.TorchProfilerToolConfig

      # Contents to profile, can be empty
      # options: cuda, cpu, memory, shapes, stack
      contents: []

      # True for each task has its own database, False for all tasks in one training step share one database.
      discrete: false

    # torch memory profiler config
    torch_memory:

      # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs
      _target_: verl.utils.profiler.config.TorchMemoryToolConfig

      # Maximum number of memory allocation entries to track
      trace_alloc_max_entries: ${oc.select:global_profiler.global_tool_config.torch_memory.trace_alloc_max_entries,100000}

      # Stack trace depth for memory allocations
      stack_depth: ${oc.select:global_profiler.global_tool_config.torch_memory.stack_depth,32}

# Router replay configuration for MoE models
router_replay:

  # Target dataclass for this configuration
  _target_: verl.workers.config.RouterReplayConfig

  # Router replay mode: disabled, R2, R3
  # - R2: Use R2 routing strategy (record mode)
  # - R3: Use R3 routing strategy (record mode)
  mode: disabled

  # File path to save recorded routing decisions
  # Required when mode is 'record', 'R2', or 'R3'
  record_file: null

  # File path to load recorded routing decisions for replay
  # Required when mode is 'replay'
  replay_file: null
